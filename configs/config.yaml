# configs/config.yaml  ── master configuration for FashionAI

project:
  name: FashionAI
  version: "3.0.0"
  seed: 42

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  images_dir:  data/images              # raw fashion product images (44,441 images)
  ansur_data:  data/ANSUR_II_MALE.csv   # real ANSUR II anthropometric dataset
  trend_data:  data/trend_data.csv      # real Google Trends data (pytrends)
  embeddings:  artifacts/embeddings.pt
  faiss_index: artifacts/faiss.index
  filenames:   artifacts/filenames.pkl
  trend_model: artifacts/trend_model.pkl

  # ── Size model artifacts (produced by preprocess_ansur.py + train_size_models.py)
  size_model:       artifacts/best_size_model.pkl   # best classifier (Logistic Regression)
  ansur_scaler:     artifacts/ansur_scaler.pkl       # StandardScaler fitted on 4 features
  ansur_label_map:  artifacts/ansur_label_map.json   # {XS:0, S:1, M:2, L:3, XL:4, XXL:5}
  ansur_processed:  data/ansur_processed.csv         # cleaned + scaled dataset (train input)

# ── Feature Extractor (PyTorch ResNet-50) ────────────────────────────────────
feature_extractor:
  backbone:      resnet50          # resnet50 | efficientnet_b3 | vit_b_16
  image_size:    224
  embedding_dim: 2048
  batch_size:    64
  num_workers:   4
  device:        auto              # auto → cuda if available, else cpu

# ── FAISS Vector Index ────────────────────────────────────────────────────────
faiss:
  n_neighbors: 6
  index_type:  Flat                # Flat | IVFFlat | HNSW
  metric:      cosine              # cosine | l2

# ── Size Model (ANSUR II — Logistic Regression) ───────────────────────────────
# Trained on 4,082 real US Army anthropometric measurements.
# Predicts size label (XS/S/M/L/XL/XXL) from body measurements.
#
# Features used (4 features — chest_cm deliberately excluded):
#   shoulder_cm   ← MediaPipe biacromialbreadth landmark distance
#   arm_cm        ← MediaPipe sleeve length chain (11→13→15)
#   height_cm     ← user enters manually
#   weight_kg     ← user enters manually
#
# Why chest_cm excluded:
#   Labels are derived from chest circumference thresholds.
#   Including chest as a feature causes models to trivially recover
#   the threshold rule (~100% accuracy) rather than learn genuine
#   body-proportion relationships. Without chest_cm the model achieves
#   ~65% accuracy — honest, meaningful prediction (6-class baseline=16.7%).
#
# Size label thresholds (chest circumference, cm):
#   XS  → chest < 88
#   S   → 88 to 96
#   M   → 96 to 104
#   L   → 104 to 112
#   XL  → 112 to 120
#   XXL → chest ≥ 120
#
# Training pipeline:
#   python scripts/preprocess_ansur.py    → data/ansur_processed.csv + scaler
#   python scripts/train_size_models.py   → best_size_model.pkl + comparison CSV
#
# Model selection criterion: highest macro F1 on 20% stratified test set.
# (Macro F1 used because dataset is imbalanced: L=1314 samples, XS=41 samples)
size_model:
  feature_cols:
    - shoulder_cm
    - arm_cm
    - height_cm
    - weight_kg
  label_order:
    - XS
    - S
    - M
    - L
    - XL
    - XXL
  test_size:    0.2      # train/test split ratio
  random_state: 42
  # Model-specific hyperparameters (for Logistic Regression winner)
  logistic_regression:
    max_iter:     1000
    class_weight: balanced
  # All models also trained for comparison:
  random_forest:
    n_estimators: 200
    max_depth:    12
    class_weight: balanced
  gradient_boosting:
    n_estimators: 150
    max_depth:    4
    learning_rate: 0.1
  decision_tree:
    max_depth:    8
    class_weight: balanced
  knn:
    n_neighbors:  7
    weights:      distance
  svm:
    kernel:       rbf
    class_weight: balanced

# ── CV Anthropometry (MediaPipe Pose Landmarker) ─────────────────────────────
# Uses Tasks API (mediapipe >= 0.10). mp.solutions.pose was removed in 0.10.
# Model file (pose_landmarker_heavy.task ~30MB) auto-downloaded on first run.
cv_anthropometry:
  model_variant:            heavy   # lite | full | heavy (heavy = most accurate)
  min_detection_confidence: 0.5
  min_presence_confidence:  0.5
  num_poses:                1
  reference_object_cm:      21.0    # A4 paper width = 21cm (real-world scale reference)
  heuristic_torso_cm:       45.0    # fallback if no reference object provided
  landmarks:
    nose:           0
    shoulder_left:  11
    shoulder_right: 12
    elbow_left:     13
    elbow_right:    14
    wrist_left:     15
    wrist_right:    16
    hip_left:       23
    hip_right:      24

# ── Trend Forecasting (Facebook Prophet) ─────────────────────────────────────
# Real data: Google Trends API (pytrends 4.9.2) for 24 fashion keywords.
# geo=IN (India), 5-year window, weekly resolution, 6,240 rows total.
# One Prophet model per (category, keyword) = 24 models.
# Negative forecasts clipped to 0. Heatmap normalised 0–100 per category.
trend_forecasting:
  forecast_horizon_days: 90
  seasonality_mode:      multiplicative
  yearly_seasonality:    true
  weekly_seasonality:    true
  monthly_fourier_order: 5
  categories:
    - color
    - silhouette
    - garment_type

# ── API ───────────────────────────────────────────────────────────────────────
api:
  host:   0.0.0.0
  port:   8000
  reload: true

# ── Streamlit Dashboard ───────────────────────────────────────────────────────
dashboard:
  port:                  8501
  top_k_recommendations: 5